<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title layout:title-pattern="$CONTENT_TITLE - 釣果管理システム">釣果管理システム</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body { display: flex; min-height: 100vh; flex-direction: column; }
    .app-body { display: flex; flex: 1; min-height: 0; }

    .sidebar {
      width: 220px; min-height: 100vh;
      background-color: #0b3d5c; color: #c9dcea;
      flex-shrink: 0; padding-top: 1rem;
      transition: transform .2s ease-in-out;
    }
    .sidebar .nav-link {
      color: #c9dcea; padding: .6rem 1.25rem;
      border-radius: 0.375rem; margin: 2px 8px;
    }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      background-color: #135a85; color: #fff;
    }
    .sidebar .brand { color: #fff; font-weight: 700; padding: .75rem 1.25rem 1rem; font-size: 1rem; }
    .main-content { flex: 1; min-width: 0; padding: 1.5rem; background-color: #f4f8fa; }
    .page-header { margin-bottom: 1rem; padding-bottom: .75rem; border-bottom: 1px solid #dee2e6; }
    .fish-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: .375rem; }

    /* ---- モバイル用トップバー(デスクトップでは非表示) ---- */
    .mobile-topbar {
      display: none;
      align-items: center; gap: .75rem;
      background-color: #0b3d5c; color: #fff;
      padding: .6rem 1rem; position: sticky; top: 0; z-index: 1040;
    }
    .mobile-topbar .menu-btn {
      background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff;
      border-radius: .375rem; padding: .3rem .55rem; line-height: 1;
    }
    .sidebar-overlay { display: none; }

    /* ---- 768px未満(スマホ・縦向きタブレット)ではサイドバーをスライド式に ---- */
    @media (max-width: 767.98px) {
      .mobile-topbar { display: flex; }
      .app-body { position: relative; }
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 1050;
        transform: translateX(-100%);
        box-shadow: 2px 0 12px rgba(0,0,0,.25);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.show {
        display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1045;
      }
      .main-content { padding: 1rem; }
    }

    /* 横幅が狭い端末でも表組みが崩れないよう横スクロールを許可 */
    .table-responsive-wrap { overflow-x: auto; }
  </style>
</head>
<body>

<!-- モバイル用トップバー -->
<div class="mobile-topbar">
  <button type="button" class="menu-btn" id="sidebarToggleBtn" aria-label="メニューを開く">
    <i class="bi bi-list" style="font-size:1.3rem;"></i>
  </button>
  <span class="fw-bold"><i class="bi bi-water me-2"></i>釣果管理</span>
</div>

<div class="app-body">
  <!-- サイドバー -->
  <nav class="sidebar d-flex flex-column" id="sidebarNav">
    <div class="brand d-none d-md-block"><i class="bi bi-water me-2"></i>釣果管理</div>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" th:href="@{/catches}">
          <i class="bi bi-list-ul me-2"></i>釣果一覧
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/catches/new}">
          <i class="bi bi-plus-circle me-2"></i>新規登録
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/catches/map}">
          <i class="bi bi-geo-alt me-2"></i>地図で見る
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/spots}">
          <i class="bi bi-anchor me-2"></i>釣り場一覧
        </a>
      </li>
    </ul>
  </nav>

  <!-- サイドバーを開いた時にスマホで表示する背景オーバーレイ(タップで閉じる) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div layout:fragment="content">
      <!-- 各ページのコンテンツがここに入る -->
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const sidebar = document.getElementById('sidebarNav');
  const overlay = document.getElementById('sidebarOverlay');
  const toggleBtn = document.getElementById('sidebarToggleBtn');

  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('show');
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  }

  toggleBtn.addEventListener('click', function () {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);
  sidebar.querySelectorAll('.nav-link').forEach(function (link) {
    link.addEventListener('click', closeSidebar);
  });
</script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
