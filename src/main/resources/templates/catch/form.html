<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>編集</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div layout:fragment="content">
  <div class="page-header">
    <h4 class="mb-0 fw-bold">
      <i class="bi bi-pencil-square me-2 text-primary"></i>釣果の編集
    </h4>
  </div>

  <form th:action="@{/catches/{id}(id=${catchForm.catchId})}"
        th:object="${catchForm}" method="post" enctype="multipart/form-data" class="card card-body" style="max-width:640px;">

    <div class="row">
      <div class="col-md-8 mb-3">
        <label class="form-label">魚種 <span class="text-danger">*</span></label>
        <input type="text" th:field="*{species}" class="form-control" placeholder="例: アジ, シーバス, メバル">
        <div class="text-danger small" th:if="${#fields.hasErrors('species')}" th:errors="*{species}"></div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">尾数 <span class="text-danger">*</span></label>
        <input type="number" min="1" th:field="*{quantity}" class="form-control">
        <div class="text-danger small" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">釣れた日時 <span class="text-danger">*</span></label>
      <input type="datetime-local" th:field="*{caughtAt}" class="form-control">
      <div class="text-danger small" th:if="${#fields.hasErrors('caughtAt')}" th:errors="*{caughtAt}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">場所 <span class="text-danger">*</span></label>
      <input type="text" th:field="*{locationName}" class="form-control" placeholder="例: 〇〇漁港">
      <div class="text-danger small" th:if="${#fields.hasErrors('locationName')}" th:errors="*{locationName}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">釣った場所(地図をクリックすると位置が設定されます・任意)</label>
      <div id="pickerMap" style="height:260px;border-radius:.375rem;" class="mb-2"></div>
      <input type="hidden" th:field="*{latitude}" id="latitudeInput">
      <input type="hidden" th:field="*{longitude}" id="longitudeInput">
      <p class="small text-muted mb-0" id="pickedLabel">位置は未設定です</p>
    </div>

    <div class="row">
      <div class="col-6 mb-3">
        <label class="form-label">サイズ(cm)</label>
        <input type="number" step="0.1" th:field="*{sizeCm}" class="form-control">
        <div class="text-danger small" th:if="${#fields.hasErrors('sizeCm')}" th:errors="*{sizeCm}"></div>
      </div>
      <div class="col-6 mb-3">
        <label class="form-label">重さ(g)</label>
        <input type="number" th:field="*{weightG}" class="form-control">
        <div class="text-danger small" th:if="${#fields.hasErrors('weightG')}" th:errors="*{weightG}"></div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">写真</label>
      <div th:if="${existingPhotoFilename != null}" class="mb-2">
        <img th:src="@{'/photos/' + ${existingPhotoFilename}}" style="max-width:160px;border-radius:.375rem;" alt="現在の写真"><br>
        <div class="form-check mt-1">
          <input class="form-check-input" type="checkbox" th:field="*{removePhoto}" id="removePhoto">
          <label class="form-check-label small text-muted" for="removePhoto">この写真を削除する</label>
        </div>
      </div>
      <input type="file" th:field="*{photo}" accept="image/*" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">メモ</label>
      <textarea th:field="*{memo}" class="form-control" rows="3" placeholder="仕掛け、ルアー、天候、潮まわりなど"></textarea>
      <div class="text-danger small" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}"></div>
    </div>

    <input type="hidden" th:field="*{catchId}">

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>保存</button>
      <a th:href="@{/catches}" class="btn btn-outline-secondary">キャンセル</a>
    </div>
  </form>
</div>

<th:block layout:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script th:inline="javascript">
    const initialLat = /*[[${catchForm.latitude}]]*/ null;
    const initialLng = /*[[${catchForm.longitude}]]*/ null;

    const startLat = initialLat != null ? initialLat : 35.6809591;
    const startLng = initialLng != null ? initialLng : 139.7673068;

    const map = L.map('pickerMap').setView([startLat, startLng], initialLat != null ? 13 : 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;
    if (initialLat != null && initialLng != null) {
      marker = L.marker([initialLat, initialLng]).addTo(map);
      document.getElementById('pickedLabel').textContent =
        '位置を設定しました(' + initialLat.toFixed(5) + ', ' + initialLng.toFixed(5) + ')';
    }

    map.on('click', function (e) {
      const { lat, lng } = e.latlng;
      document.getElementById('latitudeInput').value = lat.toFixed(6);
      document.getElementById('longitudeInput').value = lng.toFixed(6);
      document.getElementById('pickedLabel').textContent =
        '位置を設定しました(' + lat.toFixed(5) + ', ' + lng.toFixed(5) + ')';
      if (marker) {
        marker.setLatLng(e.latlng);
      } else {
        marker = L.marker(e.latlng).addTo(map);
      }
    });
  </script>
</th:block>
</body>
</html>
