<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>釣果一覧</title></head>
<body>
<div layout:fragment="content">
  <div class="page-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0 fw-bold"><i class="bi bi-list-ul me-2 text-primary"></i>釣果一覧</h4>
    <a th:href="@{/catches/new}" class="btn btn-primary btn-sm">
      <i class="bi bi-plus-lg me-1"></i>新規登録
    </a>
  </div>

  <!-- 検索・絞り込みフォーム -->
  <form th:action="@{/catches}" method="get" class="card card-body mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-sm-3">
        <label class="form-label small text-muted mb-1">魚種</label>
        <input type="text" name="species" th:value="${selectedSpecies}" class="form-control form-control-sm"
               placeholder="例: アジ" list="speciesOptions">
        <datalist id="speciesOptions">
          <option th:each="s : ${speciesList}" th:value="${s}"></option>
        </datalist>
      </div>
      <div class="col-sm-3">
        <label class="form-label small text-muted mb-1">場所</label>
        <input type="text" name="location" th:value="${selectedLocation}" class="form-control form-control-sm"
               placeholder="例: 〇〇漁港">
      </div>
      <div class="col-sm-2">
        <label class="form-label small text-muted mb-1">期間(開始)</label>
        <input type="date" name="from" th:value="${selectedFrom}"
               class="form-control form-control-sm">
      </div>
      <div class="col-sm-2">
        <label class="form-label small text-muted mb-1">期間(終了)</label>
        <input type="date" name="to" th:value="${selectedTo}"
               class="form-control form-control-sm">
      </div>
      <div class="col-sm-2 d-flex gap-2">
        <button type="submit" class="btn btn-outline-secondary btn-sm w-100">
          <i class="bi bi-search me-1"></i>検索
        </button>
        <a th:href="@{/catches}" class="btn btn-link btn-sm text-muted">クリア</a>
      </div>
    </div>
  </form>

  <div class="card">
    <div class="card-body p-0 table-responsive-wrap">
      <table class="table table-hover mb-0 align-middle">
        <thead>
          <tr>
            <th class="ps-3">写真</th>
            <th>日時</th>
            <th>魚種</th>
            <th>尾数</th>
            <th>場所</th>
            <th>サイズ</th>
            <th>重さ</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="c : ${catches}">
            <td class="ps-3">
              <img th:if="${c.photoFilename != null}" th:src="@{'/photos/' + ${c.photoFilename}}" class="fish-thumb" alt="釣果写真">
              <span th:unless="${c.photoFilename != null}" class="text-muted"><i class="bi bi-image"></i></span>
            </td>
            <td th:text="${#temporals.format(c.caughtAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 08:00</td>
            <td class="fw-semibold" th:text="${c.species}">アジ</td>
            <td th:text="${c.quantity} + ' 匹'">1 匹</td>
            <td th:text="${c.locationName}">〇〇漁港</td>
            <td th:text="${c.sizeCm != null ? c.sizeCm + ' cm' : '-'}">30 cm</td>
            <td th:text="${c.weightG != null ? c.weightG + ' g' : '-'}">200 g</td>
            <td class="text-end pe-3">
              <a th:href="@{/catches/{id}/edit(id=${c.id})}" class="btn btn-outline-secondary btn-sm me-1">
                <i class="bi bi-pencil"></i>
              </a>
              <form th:action="@{/catches/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                    onsubmit="return confirm('この釣果記録を削除しますか？')">
                <button type="submit" class="btn btn-outline-danger btn-sm">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(catches)}">
            <td colspan="8" class="text-center text-muted py-4">釣果が登録されていません</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer text-muted small">
      <span th:text="${totalCount}">0</span> 件
    </div>
  </div>
</div>
</body>
</html>
