# ======================================================
# DB接続設定(ローカル実行用)
# デフォルトではH2データベースをファイルとしてこのPC上(./data/fishlog)に保存する。
# サーバーの用意やインストール作業が不要で、./gradlew bootRun だけで起動できる。
# ======================================================
spring.datasource.url=jdbc:h2:file:${DB_FILE_PATH:./data/fishlog};AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ======================================================
# JPA / Hibernate 設定
# ======================================================
# update: 起動時にテーブルを自動作成・変更する(開発用)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ======================================================
# Thymeleaf 設定
# ======================================================
# キャッシュをオフにすると HTML 変更がすぐ反映される(開発用)
spring.thymeleaf.cache=false

# ======================================================
# サーバー設定
# Render等のPaaSは PORT 環境変数でリッスンポートを指定してくる
# ======================================================
server.port=${PORT:8080}

# ======================================================
# アプリ固有設定
# 釣果写真の保存先。このPC上にファイルとして保存される。
# ======================================================
app.upload-dir=${UPLOAD_DIR:./data/photos}

# アップロードできる写真の最大サイズ
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
