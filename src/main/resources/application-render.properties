# ======================================================
# Render(本番)用設定
# SPRING_PROFILES_ACTIVE=render で有効化する。
# Render の PostgreSQL に接続するため、環境変数 DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD
# (render.yaml の databases ブロックから自動的に渡される)を使用する。
# ======================================================
# preferQueryMode=simple: 「?species is null OR species = ?species」のような
# 「未指定なら無視する」検索条件を使うと、PostgreSQLがバインド変数の型を推論できず
# "could not determine data type of parameter" エラーになるため、拡張プロトコルでの
# 型推論を行わないシンプルモードに切り替えて回避する。
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?preferQueryMode=simple
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Render等のリバースプロキシ配下で動かす際、X-Forwarded-* ヘッダーを信頼し、
# HTTPSアクセスであることを正しく認識させる
server.forward-headers-strategy=framework

# 無料プランはディスクが永続化されないため、コンテナ再起動で写真は消える点に注意
app.upload-dir=${UPLOAD_DIR:/app/data/photos}
